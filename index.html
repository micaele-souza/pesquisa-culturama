<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"  href="culturama-favico.png" >
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Unbounded:wght@200..900&family=Work+Sans&display=swap" rel="stylesheet">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <main>>
        <header>
        <img src="img/logo-culturama.png" alt="Logo da Culturama" >
        <h1>Pesquisa de opinião</h1>
        </header>
        <section>
        <form action="sucesso.html" method="get">
    </main>
        
    <fieldset>
    
    <!-- Dados Pessoais -->
    <legend>Dados Pessoais</legend>
    <label for="name" for="userName">Nome:</label>
    <input id="name" type="text" name="userName" required>
    <br>
    <label for="age">Idade:</label>
    <input id="age" type="number" name="userAge" required>
    <br>
    <label for="birthData"> Data de Nascimento:</label>
    <input id="birthData" type="date" name="userBirthData">
    <br>
    <label for="email">Email:</label>
    <input id="email" type="email" name="userEmail" required>
    <br>
    <label for="phoneNumber">Telefone:</label>
    <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD+ numero sem espaço e hífen" aria-describedby="phoneHelp">
    <small id="phoneHelp">Preencha com 11 dígitos no formato : DDD + número sem espaço e hífen</small> 
    <br>
    <label for="image">Upload de foto:</label>
    <input id="image" type="file" name="userImage" accept="image/*" aria-describedby="imageHelp">
    <small id="imageHelp">Envie uma foto no formato JPG ou PNG</small>      
    <br>

</fieldset>

 <fieldset> 
     <legend>Perfil</legend>
     <p>Gênero:</p>
    <input id="male" type="radio" name="underGender" value="Masculino"> 
    <label for="male">Masculino:</label>
    <input id="female" type="radio" name="underGender" value="Feminino">  
    <label for="female">Feminino:</label>
    <input id="userGender" type="radio" name="underGender" value="notInformed"> 
    <label for="userGender">Prefiro não informar :</label>
    <br>
    <label for="maritalStatus">Estado Civil:</label>
    <select id="maritalStatus" name="maritalStatus">
        <option value="notInformed">selecione</option>
        <option value="solteirp">Solteiro(a)</option>
        <option value="casado">Casado(a)</option>
        <option value="divorciado">Divorciado(a)</option>
        <option value="uniao_estavel">União estável</option>
    </select>

    <label for="UserState">Estados:</label>
    <select id="UserState" name="UserState">
        <option value="notInformed">selecione...</option>
        <option value="acre" >      Acre     </option>
        <option value="alagoas" >      Alagoas  </option>
        <option value="amapa" >      Amapa    </option>
        <option value="amazonas" >      Amazonas </option>
        <option value="bahia" >      Bahia    </option>
        <option value="ceara" >      Ceara    </option>
        <option value="distritoFederal" >      Distrito Federal </option>
        <option value="espiritoSanto" >      Espirito Santo </option>
        <option value="goias" >      Goias </option>
        <option value="maranhao" >      Maranhao </option>
        <option value="matoGrossoDoSul" >      Mato Grosso do Sul </option>
        <option value="matoGrosso" >      Mato Grosso </option>
        <option value="minasGerais" >      Minas Gerais </option>
        <option value="para" >      Para </option>
        <option value="paraiba" >      Paraiba </option>
        <option value="parana" >      Parana </option>
        <option value="Pernambuco" >      Pernambuco </option>
        <option value="Piaui" >      Piaui </option>
        <option value="Rio de Janeiro" >      Rio de Janeiro </option>
        <option value="Rio Grande do Norte" >      Rio Grande do Norte </option>
        <option value="Rio Grande do Sul" >      Rio Grande do Sul </option>
        <option value="Rondonia" >      Rondonia </option>
        <option value="Roraima" >      Roraima </option>
        <option value="Santa Catarina" >      Santa Catarina </option>
        <option value="Sao Paulo" >      Sao Paulo </option>
        <option value="Sergipe" >      Sergipe </option>
        <option value="Tocantins" >      Tocantins </option>
                    
    </select>
    <br>
    <label for="city">Cidade:</label>
    <input id="city" type="text" name="userCity" autocomplete="address-level2" placeholder="Ex.: Fortaleza">
  </fieldset>

  <fieldset>
    <legend>Hábitos</legend>
    <p>Redes Sociais:</p>
    <input id="facebook" type="checkbox" name="social" value="Facebook">
    <label for="facebook">Facebook</label>
    <br>
    <input id="instagram" type="checkbox" name="social" value="Instagram">
    <label for="instagram">Instagram</label> 
    <br>
    <input id="x" type="checkbox" name="social" value="X">
    <label for="x">X</label>
    <br>
    <input id="linkedin" type="checkbox" name="social" value="Linkedin">
    <label for="linkedin">Linkedin</label>
    <br>
    <label for="musicStyle">Estilo Musical:</label>
    <input list="stylesTypes" id="musicStyle" type="text" name="userMusicStyle">
    <datalist id="stylesTypes">
        <option value="Rock">Rock</option>
        <option value="Pop">Pop</option>
        <option value="Sertanejo">Sertanejo</option>
        <option value="Funk">Funk</option>
        <option value="Pagode">Pagode</option>
        <option value="Forró">Forró</option>
        <option value="MPB">MPB</option>
    </datalist>
    <br>
    <label for="favoriteColor">Cor favorita</label>
    <input type="color" name="userFavoriteColor" id="favoriteColor">
  </fieldset>

  <fieldset> 
    <legend >Opinião</legend>
    <p>O que você acha da qualidade do nosso serviço?</p>
    <input id="great" type="radio" name="userOpinion" value="Ótimo">
    <label for="great">Ótimo</label>
    <br>
    <input id="good" type="radio" name="userOpinion" value="Bom">
    <label for="good">Bom</label>
    <br>
    <input id="regular" type="radio" name="userOpinion" value="Regular">
    <label for="regular">Regular</label>
    <br>
    <input id="bad" type="radio" name="userOpinion" value="Ruim">
    <label for="bad">Ruim</label>
    <br>
    <br>
    <label for="comments">Escreva sua opinião:</label>
    <textarea name="userComments" id="comments" placeholder="Digite aqui sua opinião..."></textarea>
  </fieldset>
  <fieldset>
    <legend>Confirmações</legend>
    <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accept" required>
    <label for="userLgpdTerm">Eu aceito participar da pesquisa</label>
    <br> 

    <input type="checkbox" name="userGetResult" id="getResult" value="accept">
    <label for="getResult">Desejo receber o resultado por email</label>
    <br>  

  </fieldset>

  <button type="submit">Enviar</button aria-label="Enviar dados do  formulário">
  <button type="reset">Limpar</button aria-label="Limpar dados do formulário">
  
  </form>
        
    </section>
</body>
</html>
